name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p "${{ github.workspace }}/out"
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/out/TV手柄_电视端.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tvpad-apk
          path: ${{ github.workspace }}/out/*.apk

  ios:
    name: iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -e
          xcodebuild \
            -project TVPad.xcodeproj \
            -scheme TVPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          set -e
          cd ios
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TVPad.app Payload/
          mkdir -p ../out
          zip -qr "../out/TV手柄_遥控端_未签名.ipa" Payload
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: tvpad-ipa
          path: ${{ github.workspace }}/out/*.ipa
