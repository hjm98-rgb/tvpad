name: apk-only

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/TV手柄_电视端.apk"
          cp android/probe/build/outputs/apk/release/probe-release.apk "out/TV手柄_诊断.apk"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: tvpad-apks
          path: ${{ github.workspace }}/out/*.apk
