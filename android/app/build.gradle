plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moustache.tvpad'
    compileSdk 34

    defaultConfig {
        applicationId "com.moustache.tvpad"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("tvpad.keystore")
            storePassword "tvpad2026"
            keyAlias "tvpad"
            keyPassword "tvpad2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
