plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moustache.tvpad.probe'
    compileSdk 34

    defaultConfig {
        applicationId "com.moustache.tvpad.probe"
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            storeFile file("../app/tvpad.keystore")
            storePassword "tvpad2026"
            keyAlias "tvpad"
            keyPassword "tvpad2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
